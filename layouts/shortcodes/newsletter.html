{{ $action := .Get 0 }}
{{ $uuid := .Get 1 }}

<form class="newsletter" id="newsletter">
  <input
    type="email"
    id="email"
    placeholder="you@example.com"
    required
  >
  <button
    type="submit"
  >
    {{ $action }}
  </button>
</form>

<script>
document.getElementById("newsletter").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value;

  const res = await fetch("https://stimulating-horse.pikapod.net/api/public/subscription", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      email: email,
      list_uuids: ["{{ $uuid }}"]
    })
  });
});
</script>
